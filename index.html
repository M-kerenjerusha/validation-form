<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        form {
            background: white;
            padding: 20px;
            max-width: 400px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 5px;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<h2>Registration Form</h2>

<form id="registrationForm">
    <label>Full Name:</label>
    <input type="text" id="fullName" placeholder="Enter full name">
    <div class="error" id="nameError"></div>

    <label>Email ID:</label>
    <input type="email" id="email" placeholder="Enter email">
    <div class="error" id="emailError"></div>

    <label>Phone Number:</label>
    <input type="text" id="phone" placeholder="Enter 10-digit phone number">
    <div class="error" id="phoneError"></div>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter password">
    <div class="error" id="passwordError"></div>

    <label>Confirm Password:</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter password">
    <div class="error" id="confirmError"></div>

    <button type="submit">Register</button>
</form>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let valid = true;
    document.querySelectorAll(".error").forEach(e => e.textContent = "");

    let name = document.getElementById("fullName").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let password = document.getElementById("password").value.trim();
    let confirmPassword = document.getElementById("confirmPassword").value.trim();

    // Name validation
    if (name.length < 5) {
        document.getElementById("nameError").textContent = "Name must be at least 5 characters.";
        valid = false;
    }

    // Email validation
    if (!email.includes("@") || email.startsWith("@") || email.endsWith("@")) {
        document.getElementById("emailError").textContent = "Enter correct email.";
        valid = false;
    }

    // Phone number validation
    if (!/^\d{10}$/.test(phone) || phone === "1234567890") {
        document.getElementById("phoneError").textContent = "Enter a valid 10-digit phone number.";
        valid = false;
    }

    // Password validation
    if (password.toLowerCase() === "password" || password.toLowerCase() === name.toLowerCase() || password.length < 8) {
        document.getElementById("passwordError").textContent = "Password is not strong.";
        valid = false;
    }

    // Confirm password validation
    if (password !== confirmPassword) {
        document.getElementById("confirmError").textContent = "Passwords do not match.";
        valid = false;
    }

    // Extra security check: at least one number & one special character in password
    let strongPassword = /^(?=.*[0-9])(?=.*[!@#$%^&*])/;
    if (!strongPassword.test(password)) {
        document.getElementById("passwordError").textContent = "Password must contain a number & special character.";
        valid = false;
    }

    if (valid) {
        alert("Form submitted successfully!");
        this.submit(); // Replace with backend call if needed
    }
});
</script>

</body>
</html>
